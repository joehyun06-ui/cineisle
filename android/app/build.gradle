plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cineisle.app'
    compileSdk 35

    signingConfigs {
        fixedDebug {
            storeFile file('../signing/cineisle-debug.jks')
            storePassword 'cineisle-debug'
            keyAlias 'cineisle-debug'
            keyPassword 'cineisle-debug'
        }
    }

    defaultConfig {
        applicationId 'com.cineisle.app'
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName '0.4.8'
    }

    buildTypes {
        debug {
            // Use a repository-stable debug key so GitHub Actions debug APKs can update
            // over previous CineIsle debug builds made from this source package.
            signingConfig signingConfigs.fixedDebug
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            ]
            testLogging.exceptionFormat = 'full'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
}

